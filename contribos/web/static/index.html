<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContribOS</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">ContribOS</a>
    <nav aria-label="主导航">
      <a id="discovery-nav" href="#" aria-current="page">发现</a>
      <a id="tasks-nav" href="#tasks">任务</a>
      <a id="settings-nav" href="#settings">设置</a>
    </nav>
    <button id="new-task" type="button">＋ 新建任务</button>
    <span id="demo-mode" class="badge" hidden>离线演示</span>
  </header>
  <main>
    <section id="discovery" class="discovery" aria-labelledby="discovery-title">
      <div class="section-title"><h1 id="discovery-title">发现机会</h1>
        <button id="scan-now" class="primary" type="button">立即扫描</button></div>
      <details class="scan-options"><summary>扫描范围</summary>
        <label>指定公开仓库 <input id="scan-repo" placeholder="owner/repo（可选）" maxlength="140"></label>
      </details>
      <p id="scan-status" class="muted" role="status"></p>
      <div id="opportunity-views" class="discovery-views" aria-label="机会视图">
        <button data-view="daily">今日推荐</button><button data-view="all">全部机会</button>
        <button data-view="starred">已收藏</button><button data-view="ignored">已忽略</button>
      </div>
      <form id="opportunity-filters" class="filters" hidden>
        <label>关键词<input name="q" type="search" placeholder="标题或仓库"></label>
        <label>语言<input name="lang" placeholder="Python"></label>
        <label>标签<input name="label" placeholder="good first issue"></label>
        <label>赏金<select name="bounty"><option value="">不限</option><option value="true">有赏金</option><option value="false">无赏金</option></select></label>
        <label>排序<select name="sort"><option value="score">总分</option><option value="updated">最近更新</option><option value="stars">仓库星数</option></select></label>
        <label><input name="small" type="checkbox" value="true"> 只看小改动</label><button>应用筛选</button>
      </form>
      <p id="opportunities-status" class="muted" role="status"></p>
      <div id="opportunities" class="opportunities"></div>
      <button id="load-opportunities" type="button" hidden>加载更多</button>
    </section>
    <div id="workspace" class="workspace" hidden>
      <aside class="sidebar" aria-label="任务列表">
        <div class="section-title"><h2>任务</h2></div>
        <p id="tasks-status" class="muted" role="status">正在加载任务…</p>
        <button id="retry-tasks" type="button" hidden>重新加载</button>
        <ul id="tasks" class="tasks"></ul>
      </aside>
      <section class="conversation" aria-labelledby="task-title">
        <header class="task-header">
          <div id="task-meta" class="task-meta"></div>
          <h1 id="task-title">贡献任务</h1>
          <p id="task-status" class="muted" role="status">选择任务或粘贴 GitHub Issue 链接开始。</p>
        </header>
        <div id="chat"></div>
      </section>
      <aside id="details" class="details" aria-label="任务详情" hidden></aside>
    </div>
    <section id="settings" class="settings" hidden>
      <h1>设置</h1>
      <div id="settings-body"></div>
    </section>
  </main>
  <dialog id="task-dialog" aria-labelledby="new-task-title">
    <form id="task-form">
      <div class="section-title">
        <h2 id="new-task-title">新建任务</h2>
        <button id="close-task" type="button" aria-label="关闭新建任务">关闭</button>
      </div>
      <label for="issue-url">GitHub Issue 链接</label>
      <input id="issue-url" type="url" required maxlength="2048" placeholder="https://github.com/owner/repo/issues/123" autofocus>
      <label for="agent">Agent</label>
      <select id="agent" required aria-describedby="agent-hint"></select>
      <div id="agent-hint" class="muted"></div>
      <fieldset>
        <legend>隔离级别</legend>
        <div id="isolation-options"></div>
        <p id="isolation-hint" class="muted" hidden></p>
      </fieldset>
      <div id="host-warning" class="warning" hidden>
        <p>本机直跑时，Agent 和仓库代码可能读取本机文件及用户目录中的凭据。请确认你信任该仓库。</p>
        <label class="choice"><input id="confirm-trust" type="checkbox"> 我信任这个仓库</label>
        <label class="choice"><input id="trust-owner" type="checkbox" disabled> 将该 owner 加入可信列表</label>
      </div>
      <p id="form-status" class="error" role="status" hidden></p>
      <div class="actions">
        <button id="retry-form" type="button" hidden>重新加载</button>
        <button id="create-task" class="primary" type="submit" disabled>创建任务</button>
      </div>
    </form>
  </dialog>
</body>
</html>
