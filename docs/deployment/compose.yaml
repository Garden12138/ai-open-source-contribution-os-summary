name: contribos-local

x-contribos-service: &contribos-service
  image: contribos-local:0.1.0
  build:
    context: ../..
    dockerfile: docs/deployment/Dockerfile
  env_file:
    - path: ../../.env
      required: false
  environment:
    DATABASE_URL: sqlite:////data/contribos.db
    ARTIFACT_ROOT: /data/artifacts
  volumes:
    - contribos-data:/data
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s

services:
  api:
    <<: *contribos-service
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *contribos-service
    command: ["worker"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  contribos-data:
    name: contribos-local-data
