name: contribos-local

x-contribos-image: &contribos-image
  image: contribos-local:0.1.0
  build:
    context: ../..
    dockerfile: docs/deployment/Dockerfile

x-app-environment: &app-environment
  DATABASE_URL: sqlite:////data/contribos.db
  ARTIFACT_ROOT: /data/artifacts
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
  ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-none}
  ANALYSIS_MODEL: ${ANALYSIS_MODEL:-minimaxai/minimax-m3}
  IMPLEMENTATION_PROVIDER: ${IMPLEMENTATION_PROVIDER:-none}
  IMPLEMENTATION_MODEL: ${IMPLEMENTATION_MODEL:-deepseek-ai/deepseek-v4-pro-0813}
  REVIEW_PROVIDER: ${REVIEW_PROVIDER:-none}
  REVIEW_MODEL: ${REVIEW_MODEL:-minimaxai/minimax-m3}
  WORKBENCH_RUNNER_IMAGE: ${WORKBENCH_RUNNER_IMAGE:-}
  PUBLISHER_MODE: ${PUBLISHER_MODE:-none}
  SANDBOX_STAGE_RUNTIME: ${SANDBOX_STAGE_RUNTIME:-none}
  SANDBOX_JOB_SPEC_KEY_ID: ${SANDBOX_JOB_SPEC_KEY_ID:-local-v1}

x-contribos-app: &contribos-app
  <<: *contribos-image
  environment: *app-environment
  volumes:
    - contribos-data:/data
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s

services:
  api:
    <<: *contribos-app
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-environment
      LOCAL_ACCESS_TOKEN: ${LOCAL_ACCESS_TOKEN:-}
      GITHUB_DISCOVERY_TOKEN_CONFIGURED: ${GITHUB_TOKEN:+true}
      SANDBOX_JOB_SPEC_SIGNING_KEY: ${SANDBOX_JOB_SPEC_SIGNING_KEY:-}
      MODEL_GATEWAY_MANAGEMENT_KEY: ${MODEL_GATEWAY_MANAGEMENT_KEY:-}
      MODEL_GATEWAY_BASE_URL: http://contribos-model-gateway:8001/v1
    networks:
      - app-internal
      - api-host
      - model-management
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *contribos-app
    command: ["worker"]
    environment:
      <<: *app-environment
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ALLOWED_HOSTS: ${GITHUB_ALLOWED_HOSTS:-api.github.com}
      GITHUB_ARCHIVE_HOSTS: ${GITHUB_ARCHIVE_HOSTS:-codeload.github.com}
      SANDBOX_JOB_SPEC_SIGNING_KEY: ${SANDBOX_JOB_SPEC_SIGNING_KEY:-}
    networks:
      - app-internal
      - external-egress
    depends_on:
      api:
        condition: service_healthy

  provider-worker:
    <<: *contribos-app
    profiles: ["nvidia"]
    command: ["provider-worker"]
    environment:
      <<: *app-environment
      MODEL_GATEWAY_BASE_URL: http://contribos-model-gateway:8001/v1
      MODEL_GATEWAY_NETWORK: contribos-model-gateway-local
      MODEL_GATEWAY_SERVICE_NAME: contribos-model-gateway
      MODEL_GATEWAY_SIGNING_KEY: ${MODEL_GATEWAY_SIGNING_KEY:-}
    networks:
      - model-internal
    depends_on:
      model-gateway:
        condition: service_healthy

  # Trusted supervisor, distinct from the untrusted Runner containers it starts.
  # Mount the existing volume at its daemon-side path so child bind mounts refer
  # to the same archive/request files without sharing the database with Runners.
  sandbox-worker:
    profiles: ["sandbox"]
    image: contribos-sandbox-worker:0.1.0
    build:
      context: ../..
      dockerfile: docs/deployment/SandboxWorker.Dockerfile
      additional_contexts:
        contribos-app: service:api
    command: ["sandbox-worker"]
    environment:
      DATABASE_URL: sqlite:///${SANDBOX_DATA_ROOT:-/var/lib/docker/volumes/contribos-local-data/_data}/contribos.db
      ARTIFACT_ROOT: ${SANDBOX_DATA_ROOT:-/var/lib/docker/volumes/contribos-local-data/_data}/artifacts
      TMPDIR: ${SANDBOX_DATA_ROOT:-/var/lib/docker/volumes/contribos-local-data/_data}/sandbox-tmp
      SANDBOX_STAGE_RUNTIME: docker
      SANDBOX_JOB_SPEC_KEY_ID: ${SANDBOX_JOB_SPEC_KEY_ID:-local-v1}
      SANDBOX_JOB_SPEC_SIGNING_KEY: ${SANDBOX_JOB_SPEC_SIGNING_KEY:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - type: volume
        source: contribos-data
        target: ${SANDBOX_DATA_ROOT:-/var/lib/docker/volumes/contribos-local-data/_data}
        volume:
          nocopy: true
      - type: bind
        source: ${SANDBOX_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    group_add: ["${SANDBOX_DOCKER_GID:-0}"]
    network_mode: none
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy

  publisher:
    profiles: ["publisher"]
    image: contribos-publisher:0.1.0
    build:
      context: ../..
      dockerfile: docs/deployment/Publisher.Dockerfile
    command: []
    environment:
      DATABASE_URL: sqlite:////data/contribos.db
      ARTIFACT_ROOT: /data/artifacts
      PUBLISHER_MODE: gh
      GH_CONFIG_DIR: /publisher-auth
    volumes:
      - contribos-data:/data
      - type: bind
        source: ${PUBLISHER_GH_CONFIG_DIR:-./publisher-auth}
        target: /publisher-auth
        read_only: true
        bind:
          create_host_path: false
    networks: [external-egress]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1536m
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 30s

  model-gateway:
    <<: *contribos-image
    profiles: ["nvidia"]
    container_name: contribos-model-gateway
    command: ["model-gateway", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MODEL_GATEWAY_SIGNING_KEY: ${MODEL_GATEWAY_SIGNING_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_HTTPS_PROXY: ${NVIDIA_HTTPS_PROXY:-}
      MODEL_GATEWAY_MANAGEMENT_KEY: ${MODEL_GATEWAY_MANAGEMENT_KEY:-}
      MODEL_GATEWAY_SECRET_ROOT: /data/model-secrets
    volumes:
      - model-secrets:/data/model-secrets
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      model-internal:
        aliases:
          - contribos-model-gateway
      external-egress: {}
      model-management: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  model-secrets:
    name: contribos-model-secrets
  contribos-data:
    name: contribos-local-data

networks:
  model-management:
    name: contribos-model-management-local
    internal: true
  app-internal:
    name: contribos-app-local
    internal: true
  # OrbStack does not publish host ports for a container attached only to an
  # internal network. This single-service bridge preserves the private
  # API/Worker network while allowing the loopback-only port binding above.
  api-host:
    name: contribos-api-host-local
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
  model-internal:
    name: contribos-model-gateway-local
    internal: true
  external-egress:
    name: contribos-external-egress-local
