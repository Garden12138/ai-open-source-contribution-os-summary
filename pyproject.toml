[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contribos"
version = "2.0.0.dev0"
description = "A local copilot for open-source contributions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "agent-client-protocol==1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
contribos = "contribos.cli:main"

[tool.setuptools.packages.find]
include = ["contribos*"]

[tool.setuptools.package-data]
contribos = ["migrations/*.sql", "web/static/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["agents: opt-in real Agent CLI acceptance on an explicitly trusted user-owned issue"]
